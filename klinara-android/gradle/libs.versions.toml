# Bağımlılık sürümleri tek dosyada — monorepo'nun pnpm catalog alışkanlığının karşılığı.
# Her yeni bağımlılık batch notunda GEREKÇESİYLE yazılır (ANDROID_DEVELOPMENT.md §3).

[versions]
agp = "9.2.1"
kotlin = "2.3.21"
composeBom = "2026.06.00"
coreKtx = "1.18.0"      # 1.19.0 compileSdk 37 ister; kurulu platform android-36.1
activityCompose = "1.13.0"
lifecycle = "2.10.0"    # 2.11.0 compileSdk 37 ister; kurulu platform android-36.1
splashscreen = "1.0.1"
coroutines = "1.11.0"
serialization = "1.11.0"
okhttp = "5.4.0"
datastore = "1.2.1"
desugar = "2.1.5"
junit5 = "5.14.0"
junitPlatform = "1.14.0"
turbine = "1.2.1"
ktlint = "13.1.0"
detekt = "1.23.8"

[libraries]
# --- Compose (BOM sürümü yönetir) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Yalnız CORE: dört ikon için (geri, ileri, uyarı, kilit). `-extended` ~1000 ikon
# taşır ve R8 sonrası bile derleme süresine yansır; ihtiyaç core ile karşılanıyor.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }

# --- AndroidX temel ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# --- Ağ ve serileştirme ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# --- java.time (API 26) ---
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

# --- Test ---
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
okhttp-mockwebserver3-junit5 = { module = "com.squareup.okhttp3:mockwebserver3-junit5", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
