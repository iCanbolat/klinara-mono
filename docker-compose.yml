services:
  postgres:
    image: postgres:17-alpine
    container_name: klinara-postgres
    environment:
      POSTGRES_USER: klinara_owner
      POSTGRES_PASSWORD: klinara_dev_password
      POSTGRES_DB: klinara
      # Türkçe sıralama/karşılaştırma davranışı üretimle aynı olsun.
      LANG: en_US.utf8
    ports:
      - '5433:5432'
    volumes:
      - klinara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klinara_owner -d klinara']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: klinara-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: klinara
      MINIO_ROOT_PASSWORD: klinara_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - klinara-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: klinara-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  klinara-pgdata:
  klinara-miniodata:
