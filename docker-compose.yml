services:
  postgres:
    image: postgres:17-alpine
    container_name: klinara-postgres
    environment:
      POSTGRES_USER: klinara_owner
      POSTGRES_PASSWORD: klinara_dev_password
      POSTGRES_DB: klinara
      # Türkçe sıralama/karşılaştırma davranışı üretimle aynı olsun.
      LANG: en_US.utf8
    # Batch 10.2 — ölçüm altyapısı.
    # `pg_stat_statements` yalnız ÖNYÜKLENDİĞİNDE çalışır; `create extension`
    # tek başına yetmez. `log_min_duration_statement` 200 ms'lik yavaş sorgu
    # eşiği: uygunluk hedefimiz bu değer, yani logda görünen her satır zaten
    # bir bütçe aşımıdır. Üretim karşılığı 10.4 runbook'una yazılacak.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=5000
      - -c
      - pg_stat_statements.track=top
      - -c
      - log_min_duration_statement=200
    ports:
      - '5433:5432'
    volumes:
      - klinara-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klinara_owner -d klinara']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: klinara-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: klinara
      MINIO_ROOT_PASSWORD: klinara_dev_password
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - klinara-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Bucket'ı ve SADECE `public/` önekinin anonim okuma politikasını kurar.
  #
  # ⚠️ Politika bucket geneline verilemez: müşteri dosyaları (tıbbi fotoğraf,
  # rapor) AYNI bucket'ta `{tenantId}/{customerId}/…` altında duruyor
  # (`files.service.ts`), public randevu sayfası varlıkları ise
  # `public/{tenantId}/…` altında (`assets.service.ts`). `mc anonymous set
  # download local/klinara` yazmak, özel nitelikli sağlık verisini internete
  # açmak demekti — önek şart.
  minio-init:
    image: minio/mc:latest
    container_name: klinara-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 klinara klinara_dev_password &&
      mc mb --ignore-existing local/klinara &&
      mc anonymous set download local/klinara/public &&
      echo '[minio-init] klinara bucket hazir, public/ oneki anonim okunabilir'
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: klinara-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  klinara-pgdata:
  klinara-miniodata:
